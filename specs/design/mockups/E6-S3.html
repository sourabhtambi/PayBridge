<script>
(function () {
  'use strict';
  var PB = (window.PB = {});
  // GET /customers -> {items:[{id,name,role}], total}
  PB.CUSTOMERS = [
    { id: 'cus_001', name: 'Aarav Mehta', role: 'customer' },
    { id: 'cus_002', name: 'Priya Nair', role: 'customer' },
    { id: 'cus_003', name: 'Rohan Iyer', role: 'customer' },
    { id: 'cus_004', name: 'Meera Kapoor', role: 'ops' },
    { id: 'cus_005', name: 'Vikram Rao', role: 'admin' }
  ];
  PB.NAV = {
    customer: [{ label: 'Payments', route: '/payments', href: 'E3-S2.html' }],
    ops: [
      { label: 'Reconciliation', route: '/reconciliation', href: 'E6-S3.html' },
      { label: 'Stuck payments', route: '/stuck-payments', href: 'E4-S5.html#stuck' }
    ],
    admin: [
      { label: 'Dashboard', route: '/dashboard', href: 'E8-S2.html' },
      { label: 'Settlement', route: '/settlement', href: 'E7-S3.html' },
      { label: 'Simulation', route: '/simulation', href: 'E4-S5.html#simulation' }
    ]
  };
  var STATE_LABELS = { happy: 'Happy path', empty: 'Empty', loading: 'Loading (skeleton)', error: 'Error' };
  var LS_KEY = 'paybridge.session';
  var timers = [];
  var cfg = null;
  var $ = function (id) { return document.getElementById(id); };
  PB.$ = $;

  /* ---------- helpers ---------- */
  PB.h = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  // Integer paise -> 'Rs 1,00,000.50' (Indian grouping). Integer math and string ops only.
  PB.fmtRs = function (paise) {
    if (!Number.isInteger(paise)) { throw new Error('amount_paise must be an integer'); }
    var neg = paise < 0; var p = Math.abs(paise);
    var rupees = String(Math.floor(p / 100));
    var pa = String(p % 100); if (pa.length < 2) { pa = '0' + pa; }
    var out = rupees;
    if (rupees.length > 3) {
      var rest = rupees.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
      out = rest + ',' + rupees.slice(-3);
    }
    return (neg ? '-' : '') + 'Rs ' + out + '.' + pa;
  };
  // Rupee string -> paise by string parsing (no floating point).
  PB.parseRupees = function (input) {
    var s = String(input).trim().replace(/^(rs\.?|₹)\s*/i, '').replace(/[,\s]/g, '');
    if (s === '') { return { ok: false, empty: true, message: 'Enter an amount in rupees' }; }
    var neg = false;
    if (s.charAt(0) === '-') { neg = true; s = s.slice(1); } else if (s.charAt(0) === '+') { s = s.slice(1); }
    var m = /^(\d+)(?:\.(\d*))?$/.exec(s);
    if (!m) { return { ok: false, message: 'Enter a valid amount in rupees, for example 1,00,000.50' }; }
    var frac = m[2] || '';
    if (frac.length > 2) { return { ok: false, message: 'Use at most two decimal places' }; }
    if (m[1].length > 13) { return { ok: false, message: 'Amount is too large' }; }
    var paise = parseInt(m[1], 10) * 100 + parseInt((frac + '00').slice(0, 2), 10);
    if (neg) { paise = -paise; }
    if (paise < 100) { return { ok: false, paise: paise, message: 'Amount must be at least Rs 1' }; }
    return { ok: true, paise: paise };
  };
  // Routing bands, BRD 5.3 (upper bounds inclusive)
  PB.routeRail = function (paise) {
    if (paise < 100) { return null; }
    if (paise <= 10000000) { return 'UPI'; }
    if (paise <= 20000000) { return 'IMPS'; }
    if (paise <= 50000000) { return 'NEFT'; }
    return 'RTGS';
  };
  PB.fmtTime = function (iso) {
    return new Intl.DateTimeFormat('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso)) + ' IST';
  };
  PB.fmtClock = function (d) {
    return new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(d);
  };
  PB.fmtAge = function (sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min ' + s + ' s');
  };
  PB.todayIST = function () {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date());
  };
  PB.uuid = function () {
    if (window.crypto && crypto.randomUUID) { return crypto.randomUUID(); }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0; return (c === 'x' ? r : (r & 3) | 8).toString(16);
    });
  };
  var BADGES = {
    state: { CREATED: ['neutral', '○'], SUBMITTED: ['info', '◐'], COMPLETED: ['success', '✓'], FAILED: ['danger', '✕'] },
    refund: { REQUESTED: ['warn', '◐'], APPROVED: ['info', '✓'], EXECUTED: ['success', '✓'], REJECTED: ['danger', '✕'], FAILED: ['danger', '✕'] },
    recon: { matched: ['success', '✓'], unmatched_internal: ['warn', '!'], unmatched_external: ['warn', '!'], amount_mismatch: ['danger', '≠'] },
    outcome: { success: ['success', '✓'], transient: ['warn', '↻'], permanent: ['danger', '✕'] },
    kind: { primary: ['info', '1'], followup: ['neutral', '+'] },
    mode: { success: ['success', '✓'], permanent_failure: ['danger', '✕'], transient: ['warn', '↻'] }
  };
  // Badge: the enum value is always rendered as text; the glyph is decorative.
  PB.badge = function (type, value) {
    var d = (BADGES[type] || {})[value] || ['neutral', '•'];
    return '<span class="badge ' + d[0] + '" data-' + type + '="' + PB.h(value) + '"><span class="g" aria-hidden="true">' + d[1] + '</span>' + PB.h(value) + '</span>';
  };
  PB.api = function (label) { return '<span class="api-tag">' + PB.h(label) + '</span>'; };
  PB.skeletonRows = function (cols, n) {
    var html = '';
    for (var i = 0; i < n; i++) {
      html += '<tr aria-hidden="true">';
      for (var c = 0; c < cols; c++) { html += '<td><span class="skel ' + (c % 2 ? 'w60' : '') + '"></span></td>'; }
      html += '</tr>';
    }
    return html;
  };
  PB.retryBanner = function (message, id, extra) {
    return '<div class="banner error" role="alert" ' + (extra || '') + '><span class="msg"><strong>Something went wrong.</strong> ' + PB.h(message) + '</span><button type="button" class="btn secondary sm" id="' + (id || 'retry') + '">Retry</button></div>';
  };
  PB.announce = function (msg) {
    var l = $('live'); l.textContent = ''; window.setTimeout(function () { l.textContent = msg; }, 30);
  };
  PB.after = function (ms, fn) { var t = window.setTimeout(fn, ms); timers.push(t); return t; };
  PB.every = function (ms, fn) { var t = window.setInterval(fn, ms); timers.push(t); return t; };
  PB.clearTimers = function () { timers.forEach(function (t) { window.clearTimeout(t); window.clearInterval(t); }); timers = []; };
  PB.query = function (k) { return new URLSearchParams(window.location.search).get(k); };
  PB.errorEnvelope = function (code, message, fields) {
    var e = { error: { code: code, message: message } }; if (fields) { e.error.fields = fields; } return e;
  };

  /* ---------- session ---------- */
  function loadSession() {
    var s = null;
    try { s = JSON.parse(window.localStorage.getItem(LS_KEY)); } catch (e) { s = null; }
    var q = PB.query('role');
    if (q && PB.NAV[q]) { s = { role: q, customer_id: (s && s.customer_id) || 'cus_001' }; }
    if (!s || !PB.NAV[s.role]) { s = { role: 'customer', customer_id: 'cus_001' }; }
    return s;
  }
  function saveSession() { try { window.localStorage.setItem(LS_KEY, JSON.stringify(PB.session)); } catch (e) { /* storage blocked */ } }
  // Headers every API request carries (E1-S4 AC3)
  PB.headers = function (extra) {
    var h = { 'X-Role': PB.session.role };
    if (PB.session.role === 'customer') { h['X-Customer-Id'] = PB.session.customer_id; }
    if (extra) { for (var k in extra) { h[k] = extra[k]; } }
    return h;
  };

  /* ---------- shell ---------- */
  function renderNav() {
    var items = PB.NAV[PB.session.role];
    $('nav-list').innerHTML = items.map(function (it) {
      var navHref = typeof cfg.nav === 'function' ? cfg.nav() : cfg.nav;
      var cur = navHref && it.href === navHref ? ' aria-current="page"' : '';
      return '<li><a href="' + it.href + '" data-route="' + it.route + '"' + cur + '>' + PB.h(it.label) + '</a></li>';
    }).join('');
  }
  function renderCustomerPicker() {
    var wrap = $('customer-wrap'); var sel = $('customer');
    var isCust = PB.session.role === 'customer';
    wrap.hidden = !isCust;
    if (!isCust) { return; }
    var list = PB.CUSTOMERS.filter(function (c) { return c.role === 'customer'; });
    sel.innerHTML = list.map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === PB.session.customer_id ? ' selected' : '') + '>' + PB.h(c.name) + ' (' + c.id + ')</option>';
    }).join('');
    sel.disabled = false;
    if (cfg.state === 'loading') { sel.innerHTML = '<option>Loading customers…</option>'; sel.disabled = true; }
  }
  function allowed() { return cfg.roles.indexOf(PB.session.role) !== -1; }
  PB.render = function () {
    PB.clearTimers();
    var main = $('main');
    renderNav(); renderCustomerPicker();
    if (!allowed()) {
      var names = cfg.roles.map(function (r) { return r.charAt(0).toUpperCase() + r.slice(1); }).join(' or ');
      var first = PB.NAV[PB.session.role][0];
      main.innerHTML = '<div class="card stack" role="alert"><h1>Not available for this role</h1>' +
        '<p>The <code>' + PB.h(cfg.route) + '</code> screen is for ' + PB.h(names) + '. Calling its API as <code>X-Role: ' + PB.session.role + '</code> returns <code>403 FORBIDDEN</code>.</p>' +
        '<pre class="mono small" style="margin:0;white-space:pre-wrap">' + PB.h(JSON.stringify(PB.errorEnvelope('FORBIDDEN', 'Role ' + PB.session.role + ' cannot access this resource'), null, 2)) + '</pre>' +
        '<p><a class="btn" href="' + first.href + '">Go to ' + PB.h(first.label) + '</a></p></div>';
      return;
    }
    var ctx = { state: cfg.state, role: PB.session.role, customer_id: PB.session.customer_id, rerender: PB.render };
    cfg.render(main, ctx);
  };
  PB.setState = function (s) { cfg.state = s; $('dev-state').value = s; PB.render(); };
  PB.state = function () { return cfg.state; };
  PB.addDev = function (html, onReady) { $('dev-extra').insertAdjacentHTML('beforeend', html); if (onReady) { onReady(); } };
  PB.init = function (c) {
    cfg = c; PB.cfg = c;
    PB.session = loadSession();
    if (cfg.roles.indexOf(PB.session.role) === -1) { PB.session.role = cfg.defaultRole; }
    var st = PB.query('state'); cfg.state = STATE_LABELS[st] && cfg.states.indexOf(st) !== -1 ? st : 'happy';
    document.title = c.id + ' ' + c.title + ' - PayBridge mockup';
    $('role').value = PB.session.role;
    $('dev-state').innerHTML = cfg.states.map(function (s) { return '<option value="' + s + '">' + STATE_LABELS[s] + '</option>'; }).join('');
    $('dev-state').value = cfg.state;
    $('role').addEventListener('change', function (e) {
      PB.session.role = e.target.value; saveSession(); PB.announce('Role changed to ' + e.target.value); PB.render();
    });
    $('customer').addEventListener('change', function (e) {
      PB.session.customer_id = e.target.value; saveSession(); PB.render();
    });
    $('dev-state').addEventListener('change', function (e) { cfg.state = e.target.value; PB.render(); });
    $('dev-api').addEventListener('change', function (e) { document.body.classList.toggle('hide-api', !e.target.checked); });
    saveSession();
    if (cfg.onInit) { cfg.onInit(); }
    PB.render();
    window.addEventListener('hashchange', function () { if (cfg.onHash) { cfg.onHash(); } PB.render(); });
  };
})();

</script>
<script>
(function () {
  'use strict';
  var PB = window.PB, h = PB.h;
  var emptyForced = false, outcome = 'ok', items = null, counts = null, running = false, runDate = '2026-10-04', lastTrigger = null;
  function seed() {
    function R(id, rail, status, pid, eid, ref, pa, sa) { return { id: id, statement_date: '2026-10-04', rail: rail, status: status, payment_id: pid, statement_entry_id: eid, payment_ref: ref, payment_amount_paise: pa, statement_amount_paise: sa, resolved: false, resolution_note: null, resolved_by: null, resolved_at: null }; }
    return [
      R('rec_a41f09c27e11', 'IMPS', 'amount_mismatch', 'pay_8f3a1c9d2b47', 'rse_00412', 'IMPS-261004-000417', 10000050, 10000005),
      R('rec_b52a10d38f22', 'UPI', 'unmatched_internal', 'pay_3e4f5a6b7c8d', null, null, 4500000, null),
      R('rec_c63b21e49a33', 'NEFT', 'unmatched_external', null, 'rse_00419', 'NEFT-261004-778120', null, 31500000),
      R('rec_d74c32f5ab44', 'RTGS', 'unmatched_external', null, 'rse_00433', 'RTGS-261004-004502', null, 120000000)
    ];
  }
  function money(v) { return v == null ? '<span class="muted" aria-label="not present">—</span>' : PB.fmtRs(v); }
  function rows() {
    return items.map(function (r) {
      return '<tr data-id="' + r.id + '"><td data-label="Status" data-field="status">' + PB.badge('recon', r.status) + '</td><td data-label="Rail" data-field="rail">' + r.rail + '</td>' +
        '<td class="mono" data-label="Payment / ref"><span data-field="payment_id">' + (r.payment_id || '—') + '</span><div class="muted xs" data-field="payment_ref">' + (r.payment_ref || 'no rail reference') + '</div></td>' +
        '<td class="num money" data-label="Payment amount" data-field="payment_amount_paise">' + money(r.payment_amount_paise) + '</td>' +
        '<td class="num money" data-label="Statement amount" data-field="statement_amount_paise">' + money(r.statement_amount_paise) + '</td>' +
        '<td data-label="Action"><button type="button" class="btn secondary sm" data-resolve="' + r.id + '" data-api="POST /reconciliation/' + r.id + '/resolve" aria-label="Resolve entry ' + r.id + ' (' + r.status + ', ' + r.rail + ')">Resolve</button></td></tr>';
    }).join('');
  }
  function countsHTML() {
    if (!counts) { return ''; }
    var L = { matched: 'Matched', unmatched_internal: 'Unmatched internal', unmatched_external: 'Unmatched external', amount_mismatch: 'Amount mismatch' };
    return '<section class="stack" aria-labelledby="res-h"><h2 id="res-h">Result for ' + h(runDate) + '</h2><div class="grid cols-4">' + Object.keys(L).map(function (k) {
      return '<div class="tile" data-count="' + k + '"><div class="k">' + L[k] + ' <span class="xs mono muted">(' + k + ')</span></div><div class="v">' + counts[k] + '</div></div>';
    }).join('') + '</div></section>';
  }
  function queue(ctx) {
    var body = ctx.state === 'loading' ? PB.skeletonRows(6, 4) : rows();
    if (ctx.state === 'error') { return PB.retryBanner('Could not load unmatched entries: Internal server error (INTERNAL_ERROR).', 'retry'); }
    if (ctx.state !== 'loading' && !items.length) { return '<div class="card" style="text-align:center;padding:var(--s-7) var(--s-4)"><h2 tabindex="-1" id="q-h">Nothing to reconcile</h2><p class="secondary">Every statement entry is matched or resolved.</p></div>'; }
    return '<section class="card flush" ' + (ctx.state === 'loading' ? 'aria-busy="true"' : '') + '><div class="table-wrap"><table class="data stack"><caption id="q-h" tabindex="-1">Unmatched entries ' + PB.api('GET /reconciliation/unmatched') + '</caption><thead><tr><th scope="col">Status</th><th scope="col">Rail</th><th scope="col">Payment / ref</th><th scope="col" class="num">Payment amount</th><th scope="col" class="num">Statement amount</th><th scope="col">Action</th></tr></thead><tbody>' + body + '</tbody></table></div></section>';
  }
  function render(root, ctx) {
    if (!items || (ctx.state === 'empty' && !emptyForced) || (ctx.state !== 'empty' && emptyForced)) { emptyForced = ctx.state === 'empty'; items = emptyForced ? [] : seed(); }
    root.innerHTML = '<div class="page-head"><div><h1>Reconciliation</h1><p>Run reconciliation for a statement date, then work the unmatched queue.</p></div><span class="route">/reconciliation</span></div>' +
      '<div class="stack"><form class="card" id="run-form" aria-labelledby="run-h" data-api="POST /reconciliation/run"><h2 id="run-h">Run reconciliation ' + PB.api('POST /reconciliation/run {statement_date}') + '</h2>' +
      '<div class="row" style="align-items:flex-end"><div class="field"><label for="statement_date">Statement date</label><input class="input" type="date" id="statement_date" name="statement_date" value="' + runDate + '" style="width:auto"></div>' +
      '<button type="submit" class="btn" id="run-btn" ' + (running ? 'disabled' : '') + '>' + (running ? '<span class="spinner" aria-hidden="true"></span>Running…' : 'Run reconciliation') + '</button></div>' +
      '<div role="status" aria-live="polite" id="run-status" class="small secondary" style="margin-top:var(--s-3)"></div></form>' +
      '<div id="counts">' + countsHTML() + '</div><div id="queue">' + queue(ctx) + '</div>' +
      '<p class="muted small">Resolving needs a note and marks the entry resolved. Nothing is auto-corrected. Resolve returns the updated ReconResult.</p></div>';
    var r = PB.$('retry'); if (r) { r.addEventListener('click', function () { PB.setState('loading'); PB.after(800, function () { PB.setState('happy'); }); }); }
    PB.$('run-form').addEventListener('submit', function (e) {
      e.preventDefault(); runDate = PB.$('statement_date').value; running = true; PB.render();
      PB.after(900, function () {
        running = false; counts = { matched: 38, unmatched_internal: 1, unmatched_external: 2, amount_mismatch: 1 }; PB.render();
        PB.$('run-status').textContent = 'Reconciliation finished for ' + runDate + '. 4 entries need attention.';
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-resolve]'), function (b) { b.addEventListener('click', function () { openDialog(b); }); });
  }
  /* ---- focus-trapped resolve dialog ---- */
  function openDialog(trigger) {
    var id = trigger.getAttribute('data-resolve'); var rec = items.filter(function (x) { return x.id === id; })[0];
    lastTrigger = trigger;
    var ov = document.createElement('div'); ov.className = 'overlay'; ov.id = 'overlay';
    ov.innerHTML = '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-h" aria-describedby="dlg-d" id="dialog"><h2 id="dlg-h">Resolve entry <span class="mono">' + id + '</span></h2>' +
      '<p id="dlg-d" class="secondary small">' + PB.badge('recon', rec.status) + ' on ' + rec.rail + '. Add a note explaining the resolution. ' + PB.api('POST /reconciliation/{id}/resolve {note}') + '</p>' +
      '<form id="dlg-form" novalidate style="margin-top:var(--s-4)"><div class="field"><label for="note">Resolution note</label><textarea class="input" id="note" name="note" aria-describedby="note-err" aria-required="true" placeholder="e.g. Rail confirmed correct amount on call with NPCI desk"></textarea><span id="note-err"></span></div>' +
      '<div id="dlg-err" role="alert"></div>' +
      '<div class="actions"><button type="button" class="btn secondary" id="dlg-cancel">Cancel</button><button type="submit" class="btn" id="dlg-ok">Resolve entry</button></div></form></div>';
    var inertEls = Array.prototype.slice.call(document.body.children).filter(function (el) { return el.tagName !== 'SCRIPT'; });
    inertEls.forEach(function (el) { el.setAttribute('inert', ''); el.setAttribute('aria-hidden', 'true'); });
    document.body.appendChild(ov);
    var note = PB.$('note'); note.focus();
    function close(focusEl) {
      document.removeEventListener('keydown', onKey, true); ov.remove();
      inertEls.forEach(function (el) { el.removeAttribute('inert'); el.removeAttribute('aria-hidden'); });
      var t = focusEl || (document.body.contains(lastTrigger) ? lastTrigger : PB.$('q-h')); if (t) { t.focus(); }
    }
    function focusables() { return Array.prototype.slice.call(ov.querySelectorAll('textarea, button, [href], input, select')).filter(function (e) { return !e.disabled; }); }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); return; }
      if (e.key !== 'Tab') { return; }
      var f = focusables(); var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      else if (!ov.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    }
    document.addEventListener('keydown', onKey, true);
    PB.$('dlg-cancel').addEventListener('click', function () { close(); });
    ov.addEventListener('mousedown', function (e) { if (e.target === ov) { close(); } });
    PB.$('dlg-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = note.value.trim();
      if (!v) { PB.$('note-err').innerHTML = '<span class="field-error" data-field="note">Enter a resolution note</span>'; note.setAttribute('aria-invalid', 'true'); note.focus(); return; }
      var ok = PB.$('dlg-ok'); ok.disabled = true; ok.innerHTML = '<span class="spinner" aria-hidden="true"></span>Resolving…';
      PB.after(700, function () {
        if (outcome === '409') { ok.disabled = false; ok.textContent = 'Resolve entry'; PB.$('dlg-err').innerHTML = '<div class="banner error" style="margin-top:var(--s-3)"><span class="msg"><strong>409 RECON_ALREADY_RESOLVED.</strong> This entry was already resolved.</span></div>'; return; }
        if (outcome === '500') { ok.disabled = false; ok.textContent = 'Resolve entry'; PB.$('dlg-err').innerHTML = '<div class="banner error" style="margin-top:var(--s-3)"><span class="msg"><strong>500 INTERNAL_ERROR.</strong> Something went wrong. Please try again.</span></div>'; return; }
        var idx = items.indexOf(rec); items.splice(idx, 1);
        close(null); PB.render(); PB.announce('Entry ' + id + ' resolved and removed from the queue');
        var next = items[idx] || items[idx - 1]; var f = next ? document.querySelector('[data-resolve="' + next.id + '"]') : PB.$('q-h'); if (f) { f.focus(); }
      });
    });
    note.addEventListener('input', function () { PB.$('note-err').innerHTML = ''; note.removeAttribute('aria-invalid'); });
  }
  PB.init({
    id: 'E6-S3', title: 'Reconciliation', route: '/reconciliation', roles: ['ops', 'admin'], defaultRole: 'ops', nav: 'E6-S3.html', states: ['happy', 'empty', 'loading', 'error'], render: render,
    onInit: function () {
      PB.addDev('<label>Resolve outcome <select id="dev-out" aria-label="Resolve outcome"><option value="ok">200 ReconResult</option><option value="409">409 RECON_ALREADY_RESOLVED</option><option value="500">500 INTERNAL_ERROR</option></select></label>');
      PB.$('dev-out').addEventListener('change', function (e) { outcome = e.target.value; });
    }
  });
})();

</script>
