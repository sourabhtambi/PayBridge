<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E8-S2 Admin dashboard - PayBridge mockup</title>
<!--
  PayBridge mockup E8-S2: Admin dashboard
  Self-contained: all CSS and JS inline, no external requests. Data is hardcoded and uses the field names from specs/design/conventions.md.
  API calls this screen represents: GET /dashboard/summary?date=, POST /refunds/{id}/approve|reject
  Open with ?state=empty|loading|error and ?role=customer|ops|admin to preset the state, or use the Mockup controls bar.
-->
<style>
/* ===== tokens.css (identical in every mockup) ===== */
:root{
  --color-bg:#F4F6FA;
  --color-surface:#FFFFFF;
  --color-surface-sunken:#EAEFF6;
  --color-text:#101C32;
  --color-text-secondary:#44506A;
  --color-text-muted:#566178;
  --color-primary:#0B57B7;
  --color-primary-hover:#09448F;
  --color-on-primary:#FFFFFF;
  --color-link:#0B57B7;
  --color-border-strong:#6B7689;
  --color-divider:#D3DAE6;
  --color-focus-ring:#0B57B7;
  --color-focus-ring-on-dark:#FFD166;
  --color-nav-bg:#0B2545;
  --color-nav-text:#FFFFFF;
  --color-nav-text-muted:#BFD0E6;
  --color-nav-active-bg:#1B4577;
  --color-dev-bg:#1F2937;
  --color-dev-text:#F9FAFB;
  --color-neutral-bg:#E6EBF3;
  --color-neutral-text:#2E3A52;
  --color-info-bg:#E1EDFF;
  --color-info-text:#0A3F86;
  --color-success-bg:#E3F5EA;
  --color-success-text:#0B6A33;
  --color-warn-bg:#FFF3D1;
  --color-warn-text:#6F4A00;
  --color-danger-bg:#FDECEC;
  --color-danger-text:#A1161B;
  --color-danger-border:#C0262B;
  --color-danger-solid:#B3201F;
  --color-disabled-bg:#E1E5EC;
  --color-disabled-text:#566178;
  --color-placeholder:#5F6B80;
  --color-skeleton:#DCE3EE;
  --color-skeleton-hi:#EEF2F8;
  --font-sans:"Segoe UI","Helvetica Neue","Noto Sans","Liberation Sans",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --fs-xs:12px;--fs-sm:14px;--fs-md:16px;--fs-lg:18px;--fs-xl:22px;--fs-2xl:28px;--fs-3xl:34px;
  --lh-tight:1.25;--lh-body:1.5;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:24px;--s-6:32px;--s-7:40px;--s-8:56px;
  --radius-sm:4px;--radius-md:8px;--radius-lg:12px;--radius-pill:999px;
  --elev-0:none;--elev-1:0 1px 2px rgba(16,28,50,.08);--elev-2:0 4px 12px rgba(16,28,50,.12);--elev-3:0 12px 32px rgba(16,28,50,.24);
}
/* ---- Base ---- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);font-size:var(--fs-md);line-height:var(--lh-body);overflow-x:hidden}
h1,h2,h3{margin:0;line-height:var(--lh-tight);font-weight:650;letter-spacing:-0.01em}
h1{font-size:var(--fs-2xl)}h2{font-size:var(--fs-xl)}h3{font-size:var(--fs-lg)}
p{margin:0}
a{color:var(--color-link);text-underline-offset:3px}
a:hover{color:var(--color-primary-hover)}
code,.mono{font-family:var(--font-mono);font-size:.92em}
:focus-visible{outline:3px solid var(--color-focus-ring);outline-offset:2px;border-radius:var(--radius-sm)}
.on-dark :focus-visible{outline-color:var(--color-focus-ring-on-dark)}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:var(--s-3);top:-100px;background:var(--color-surface);color:var(--color-text);padding:var(--s-2) var(--s-3);border-radius:var(--radius-md);z-index:100;box-shadow:var(--elev-3)}
.skip:focus{top:var(--s-3)}
/* ---- Dev bar (mockup only) ---- */
.devbar{background:var(--color-dev-bg);color:var(--color-dev-text);font-size:var(--fs-sm);padding:var(--s-2) var(--s-4);display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-4);align-items:center}
.devbar strong{letter-spacing:.04em;text-transform:uppercase;font-size:var(--fs-xs)}
.devbar label{display:inline-flex;align-items:center;gap:var(--s-2)}
.devbar select{font:inherit;font-size:var(--fs-sm);min-height:32px;border-radius:var(--radius-sm);border:1px solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);padding:0 var(--s-2);max-width:100%}
.devbar input[type=checkbox]{width:18px;height:18px}
.devbar :focus-visible{outline-color:var(--color-focus-ring-on-dark)}
.devbar #dev-extra{display:contents}
body.hide-api .api-tag{display:none}
.api-tag{display:inline-block;font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--color-text-secondary);background:var(--color-surface-sunken);border:1px dashed var(--color-border-strong);border-radius:var(--radius-sm);padding:1px var(--s-2);margin-left:var(--s-2);vertical-align:middle;white-space:normal;overflow-wrap:anywhere}
.appbar .api-tag,.nav .api-tag{background:transparent;color:var(--color-nav-text-muted);border-color:var(--color-nav-text-muted)}
/* ---- App shell ---- */
.appbar{background:var(--color-nav-bg);color:var(--color-nav-text);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s-3) var(--s-6);padding:var(--s-3) var(--s-4)}
.appbar.on-dark label{color:var(--color-nav-text-muted);font-size:var(--fs-sm);font-weight:600}
.brand{display:flex;align-items:center;gap:var(--s-2);font-weight:700;font-size:var(--fs-lg);letter-spacing:-.01em}
.brand-mark{width:28px;height:28px;border-radius:var(--radius-md);background:var(--color-nav-active-bg);display:grid;place-items:center;border:1px solid var(--color-nav-text-muted);font-size:var(--fs-sm)}
.session{display:flex;flex-wrap:wrap;gap:var(--s-3) var(--s-4);align-items:center}
.field-inline{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap}
.appbar select{font:inherit;min-height:40px;border-radius:var(--radius-md);border:1px solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);padding:0 var(--s-3);min-width:140px;max-width:100%}
.nav{background:var(--color-nav-bg);border-top:1px solid var(--color-nav-active-bg);padding:0 var(--s-4)}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--s-1)}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 var(--s-4);color:var(--color-nav-text);text-decoration:none;border-bottom:3px solid transparent;font-weight:600}
.nav a:hover{background:var(--color-nav-active-bg);color:var(--color-nav-text)}
.nav a[aria-current=page]{background:var(--color-nav-active-bg);border-bottom-color:var(--color-focus-ring-on-dark)}
main{max-width:1180px;margin:0 auto;padding:var(--s-6) var(--s-4) var(--s-8)}
.page-head{display:flex;flex-wrap:wrap;gap:var(--s-3) var(--s-4);align-items:flex-start;justify-content:space-between;margin-bottom:var(--s-5)}
.page-head p{color:var(--color-text-secondary);margin-top:var(--s-1)}
.route{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--color-text-muted)}
.grid{display:grid;gap:var(--s-4)}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack>*+*{margin-top:var(--s-4)}
.row{display:flex;flex-wrap:wrap;gap:var(--s-3);align-items:center}
.card{background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-lg);box-shadow:var(--elev-1);padding:var(--s-5);min-width:0}
.card>h2,.card>h3{margin-bottom:var(--s-3)}
.card.flush{padding:0;overflow:hidden}
.success-text{color:var(--color-success-text)}
.muted{color:var(--color-text-muted)}.secondary{color:var(--color-text-secondary)}
.small{font-size:var(--fs-sm)}.xs{font-size:var(--fs-xs)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);min-height:40px;padding:0 var(--s-4);border-radius:var(--radius-md);border:1px solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--color-primary-hover);color:var(--color-on-primary)}
.btn.secondary{background:var(--color-surface);color:var(--color-primary);border-color:var(--color-primary)}
.btn.secondary:hover{background:var(--color-surface-sunken);color:var(--color-primary-hover)}
.btn.danger{background:var(--color-danger-solid);border-color:var(--color-danger-solid)}
.btn.danger:hover{background:var(--color-danger-text)}
.btn.sm{min-height:36px;padding:0 var(--s-3);font-size:var(--fs-sm)}
.btn[disabled],.btn[aria-disabled=true]{background:var(--color-disabled-bg);color:var(--color-disabled-text);border-color:var(--color-border-strong);cursor:not-allowed}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---- Forms ---- */
.field{display:flex;flex-direction:column;gap:var(--s-1)}
.field label,.field legend,.label{font-weight:600;font-size:var(--fs-sm)}
.field .hint{color:var(--color-text-muted);font-size:var(--fs-sm)}
.input,select.input,textarea.input{font:inherit;min-height:44px;width:100%;border-radius:var(--radius-md);border:1px solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);padding:var(--s-2) var(--s-3)}
textarea.input{min-height:96px;resize:vertical}
.input::placeholder{color:var(--color-placeholder);opacity:1}
.input[aria-invalid=true]{border:2px solid var(--color-danger-border)}
.field-error{color:var(--color-danger-text);font-size:var(--fs-sm);font-weight:600;display:flex;gap:var(--s-1)}
.field-error::before{content:"\26A0";}
fieldset.field{border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:var(--s-3) var(--s-4);margin:0;min-width:0}
.radio{display:flex;align-items:center;gap:var(--s-2);min-height:36px}
.radio input{width:20px;height:20px;accent-color:var(--color-primary);margin:0}
/* ---- Banners ---- */
.banner{display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-3);align-items:center;border:1px solid;border-radius:var(--radius-md);padding:var(--s-3) var(--s-4)}
.banner .msg{flex:1 1 220px}
.banner.error{background:var(--color-danger-bg);color:var(--color-danger-text);border-color:var(--color-danger-border)}
.banner.success{background:var(--color-success-bg);color:var(--color-success-text);border-color:var(--color-success-text)}
.banner.info{background:var(--color-info-bg);color:var(--color-info-text);border-color:var(--color-info-text)}
.banner.warn{background:var(--color-warn-bg);color:var(--color-warn-text);border-color:var(--color-warn-text)}
.banner .btn{background:var(--color-surface)}
.banner strong{font-weight:700}
/* ---- Badges (text always present, glyph is decoration) ---- */
.badge{display:inline-flex;align-items:center;gap:var(--s-1);padding:2px var(--s-2);border-radius:var(--radius-pill);border:1px solid currentColor;font-size:var(--fs-xs);font-weight:700;letter-spacing:.03em;white-space:nowrap;line-height:1.5}
.badge .g{font-size:var(--fs-xs);line-height:1}
.badge.neutral{background:var(--color-neutral-bg);color:var(--color-neutral-text)}
.badge.info{background:var(--color-info-bg);color:var(--color-info-text)}
.badge.success{background:var(--color-success-bg);color:var(--color-success-text)}
.badge.warn{background:var(--color-warn-bg);color:var(--color-warn-text)}
.badge.danger{background:var(--color-danger-bg);color:var(--color-danger-text)}
/* ---- Tables ---- */
.table-wrap{width:100%}
table.data{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
table.data caption{text-align:left;font-weight:650;font-size:var(--fs-md);padding:var(--s-4) var(--s-4) var(--s-2)}
table.data th{text-align:left;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-secondary);background:var(--color-surface-sunken);padding:var(--s-2) var(--s-4);border-bottom:1px solid var(--color-divider);white-space:nowrap}
table.data td{padding:var(--s-3) var(--s-4);border-bottom:1px solid var(--color-divider);vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data th.num,table.data td.num{text-align:right}
table.data tbody tr:hover{background:var(--color-bg)}
/* ---- Skeleton ---- */
.skel{display:block;height:14px;border-radius:var(--radius-sm);background:linear-gradient(90deg,var(--color-skeleton) 25%,var(--color-skeleton-hi) 50%,var(--color-skeleton) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.skel.tall{height:36px}.skel.w60{width:60%}.skel.w40{width:40%}
/* ---- Tiles, KV, timeline ---- */
.tile{background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-lg);box-shadow:var(--elev-1);padding:var(--s-4);min-width:0}
.tile .k{font-size:var(--fs-sm);color:var(--color-text-secondary);font-weight:600}
.tile .v{font-size:var(--fs-xl);font-weight:700;font-variant-numeric:tabular-nums;margin-top:var(--s-1);overflow-wrap:anywhere}
.tile .s{font-size:var(--fs-sm);color:var(--color-text-muted);margin-top:var(--s-1)}
dl.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:var(--s-2) var(--s-4);margin:0}
dl.kv dt{color:var(--color-text-secondary);font-size:var(--fs-sm);font-weight:600}
dl.kv dd{margin:0;overflow-wrap:anywhere}
ol.timeline{list-style:none;margin:0;padding:0 0 0 var(--s-5);border-left:2px solid var(--color-border-strong)}
ol.timeline li{position:relative;padding:0 0 var(--s-4) var(--s-4)}
ol.timeline li::before{content:"";position:absolute;left:calc(-1 * var(--s-5) - 7px);top:6px;width:12px;height:12px;border-radius:50%;background:var(--color-surface);border:3px solid var(--color-primary)}
ol.timeline .t{font-weight:650;font-family:var(--font-mono);font-size:var(--fs-sm);overflow-wrap:anywhere}
ol.timeline .at{color:var(--color-text-muted);font-size:var(--fs-xs)}
/* ---- Dialog ---- */
.overlay{position:fixed;inset:0;background:rgba(16,28,50,.62);display:grid;place-items:center;padding:var(--s-4);z-index:50}
.dialog{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--elev-3);padding:var(--s-5);width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto}
.dialog h2{margin-bottom:var(--s-2)}
.dialog .actions{display:flex;flex-wrap:wrap;gap:var(--s-3);justify-content:flex-end;margin-top:var(--s-4)}
/* ---- Responsive ---- */
@media (max-width:960px){.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
 main{padding:var(--s-4) var(--s-3) var(--s-7)}
 .cols-2,.cols-3,.cols-4{grid-template-columns:minmax(0,1fr)}
 .appbar{padding:var(--s-3)}.nav{padding:0 var(--s-2)}
 .session{width:100%}.session .field-inline{width:100%}.appbar select{flex:1 1 160px}
 h1{font-size:var(--fs-xl)}
 dl.kv{grid-template-columns:1fr;gap:0}dl.kv dd{margin-bottom:var(--s-2)}
 table.stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
 table.stack,table.stack tbody,table.stack tr,table.stack td,table.stack caption{display:block;width:100%}
 table.stack tr{padding:var(--s-3) var(--s-4);border-bottom:1px solid var(--color-divider)}
 table.stack td{border:0;padding:var(--s-1) 0;display:flex;justify-content:space-between;gap:var(--s-3);text-align:right}
 table.stack td::before{content:attr(data-label);font-weight:650;color:var(--color-text-secondary);text-align:left;flex:0 0 40%}
 table.stack td.num{text-align:right}
 .btn{min-height:44px}
}
@media (prefers-reduced-motion:reduce){.skel,.spinner{animation:none}}
.grayscale{filter:grayscale(1)}
main{overflow-wrap:break-word}main pre{max-width:100%}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div class="devbar" role="region" aria-label="Mockup controls (not part of the product)">
  <strong>Mockup controls</strong>
  <label>State <select id="dev-state" aria-label="State"></select></label>
  <span id="dev-extra"></span>
  <label><input type="checkbox" id="dev-api" checked> Show API annotations</label>
</div>
<header class="appbar on-dark">
  <div class="brand"><span class="brand-mark" aria-hidden="true">PB</span> PayBridge</div>
  <div class="session">
    <div class="field-inline">
      <label for="role">Role</label>
      <select id="role"><option value="customer">Customer</option><option value="ops">Ops</option><option value="admin">Admin</option></select>
    </div>
    <div class="field-inline" id="customer-wrap" hidden>
      <label for="customer">Customer</label>
      <select id="customer" data-api="GET /customers"></select>
      <span class="api-tag">GET /customers</span>
    </div>
  </div>
</header>
<nav class="nav on-dark" id="nav" aria-label="Primary"><ul id="nav-list"></ul></nav>
<main id="main" tabindex="-1"></main>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var PB = (window.PB = {});
  // GET /customers -> {items:[{id,name,role}], total}
  PB.CUSTOMERS = [
    { id: 'cus_001', name: 'Aarav Mehta', role: 'customer' },
    { id: 'cus_002', name: 'Priya Nair', role: 'customer' },
    { id: 'cus_003', name: 'Rohan Iyer', role: 'customer' },
    { id: 'cus_004', name: 'Meera Kapoor', role: 'ops' },
    { id: 'cus_005', name: 'Vikram Rao', role: 'admin' }
  ];
  PB.NAV = {
    customer: [{ label: 'Payments', route: '/payments', href: 'E3-S2.html' }],
    ops: [
      { label: 'Reconciliation', route: '/reconciliation', href: 'E6-S3.html' },
      { label: 'Stuck payments', route: '/stuck-payments', href: 'E4-S5.html#stuck' }
    ],
    admin: [
      { label: 'Dashboard', route: '/dashboard', href: 'E8-S2.html' },
      { label: 'Settlement', route: '/settlement', href: 'E7-S3.html' },
      { label: 'Simulation', route: '/simulation', href: 'E4-S5.html#simulation' }
    ]
  };
  var STATE_LABELS = { happy: 'Happy path', empty: 'Empty', loading: 'Loading (skeleton)', error: 'Error' };
  var LS_KEY = 'paybridge.session';
  var timers = [];
  var cfg = null;
  var $ = function (id) { return document.getElementById(id); };
  PB.$ = $;

  /* ---------- helpers ---------- */
  PB.h = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  // Integer paise -> 'Rs 1,00,000.50' (Indian grouping). Integer math and string ops only.
  PB.fmtRs = function (paise) {
    if (!Number.isInteger(paise)) { throw new Error('amount_paise must be an integer'); }
    var neg = paise < 0; var p = Math.abs(paise);
    var rupees = String(Math.floor(p / 100));
    var pa = String(p % 100); if (pa.length < 2) { pa = '0' + pa; }
    var out = rupees;
    if (rupees.length > 3) {
      var rest = rupees.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
      out = rest + ',' + rupees.slice(-3);
    }
    return (neg ? '-' : '') + 'Rs ' + out + '.' + pa;
  };
  // Rupee string -> paise by string parsing (no floating point).
  PB.parseRupees = function (input) {
    var s = String(input).trim().replace(/^(rs\.?|₹)\s*/i, '').replace(/[,\s]/g, '');
    if (s === '') { return { ok: false, empty: true, message: 'Enter an amount in rupees' }; }
    var neg = false;
    if (s.charAt(0) === '-') { neg = true; s = s.slice(1); } else if (s.charAt(0) === '+') { s = s.slice(1); }
    var m = /^(\d+)(?:\.(\d*))?$/.exec(s);
    if (!m) { return { ok: false, message: 'Enter a valid amount in rupees, for example 1,00,000.50' }; }
    var frac = m[2] || '';
    if (frac.length > 2) { return { ok: false, message: 'Use at most two decimal places' }; }
    if (m[1].length > 13) { return { ok: false, message: 'Amount is too large' }; }
    var paise = parseInt(m[1], 10) * 100 + parseInt((frac + '00').slice(0, 2), 10);
    if (neg) { paise = -paise; }
    if (paise < 100) { return { ok: false, paise: paise, message: 'Amount must be at least Rs 1' }; }
    return { ok: true, paise: paise };
  };
  // Routing bands, BRD 5.3 (upper bounds inclusive)
  PB.routeRail = function (paise) {
    if (paise < 100) { return null; }
    if (paise <= 10000000) { return 'UPI'; }
    if (paise <= 20000000) { return 'IMPS'; }
    if (paise <= 50000000) { return 'NEFT'; }
    return 'RTGS';
  };
  PB.fmtTime = function (iso) {
    return new Intl.DateTimeFormat('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso)) + ' IST';
  };
  PB.fmtClock = function (d) {
    return new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(d);
  };
  PB.fmtAge = function (sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min ' + s + ' s');
  };
  PB.todayIST = function () {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date());
  };
  PB.uuid = function () {
    if (window.crypto && crypto.randomUUID) { return crypto.randomUUID(); }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0; return (c === 'x' ? r : (r & 3) | 8).toString(16);
    });
  };
  var BADGES = {
    state: { CREATED: ['neutral', '○'], SUBMITTED: ['info', '◐'], COMPLETED: ['success', '✓'], FAILED: ['danger', '✕'] },
    refund: { REQUESTED: ['warn', '◐'], APPROVED: ['info', '✓'], EXECUTED: ['success', '✓'], REJECTED: ['danger', '✕'], FAILED: ['danger', '✕'] },
    recon: { matched: ['success', '✓'], unmatched_internal: ['warn', '!'], unmatched_external: ['warn', '!'], amount_mismatch: ['danger', '≠'] },
    outcome: { success: ['success', '✓'], transient: ['warn', '↻'], permanent: ['danger', '✕'] },
    kind: { primary: ['info', '1'], followup: ['neutral', '+'] },
    mode: { success: ['success', '✓'], permanent_failure: ['danger', '✕'], transient: ['warn', '↻'] }
  };
  // Badge: the enum value is always rendered as text; the glyph is decorative.
  PB.badge = function (type, value) {
    var d = (BADGES[type] || {})[value] || ['neutral', '•'];
    return '<span class="badge ' + d[0] + '" data-' + type + '="' + PB.h(value) + '"><span class="g" aria-hidden="true">' + d[1] + '</span>' + PB.h(value) + '</span>';
  };
  PB.api = function (label) { return '<span class="api-tag">' + PB.h(label) + '</span>'; };
  PB.skeletonRows = function (cols, n) {
    var html = '';
    for (var i = 0; i < n; i++) {
      html += '<tr aria-hidden="true">';
      for (var c = 0; c < cols; c++) { html += '<td><span class="skel ' + (c % 2 ? 'w60' : '') + '"></span></td>'; }
      html += '</tr>';
    }
    return html;
  };
  PB.retryBanner = function (message, id, extra) {
    return '<div class="banner error" role="alert" ' + (extra || '') + '><span class="msg"><strong>Something went wrong.</strong> ' + PB.h(message) + '</span><button type="button" class="btn secondary sm" id="' + (id || 'retry') + '">Retry</button></div>';
  };
  PB.announce = function (msg) {
    var l = $('live'); l.textContent = ''; window.setTimeout(function () { l.textContent = msg; }, 30);
  };
  PB.after = function (ms, fn) { var t = window.setTimeout(fn, ms); timers.push(t); return t; };
  PB.every = function (ms, fn) { var t = window.setInterval(fn, ms); timers.push(t); return t; };
  PB.clearTimers = function () { timers.forEach(function (t) { window.clearTimeout(t); window.clearInterval(t); }); timers = []; };
  PB.query = function (k) { return new URLSearchParams(window.location.search).get(k); };
  PB.errorEnvelope = function (code, message, fields) {
    var e = { error: { code: code, message: message } }; if (fields) { e.error.fields = fields; } return e;
  };

  /* ---------- session ---------- */
  function loadSession() {
    var s = null;
    try { s = JSON.parse(window.localStorage.getItem(LS_KEY)); } catch (e) { s = null; }
    var q = PB.query('role');
    if (q && PB.NAV[q]) { s = { role: q, customer_id: (s && s.customer_id) || 'cus_001' }; }
    if (!s || !PB.NAV[s.role]) { s = { role: 'customer', customer_id: 'cus_001' }; }
    return s;
  }
  function saveSession() { try { window.localStorage.setItem(LS_KEY, JSON.stringify(PB.session)); } catch (e) { /* storage blocked */ } }
  // Headers every API request carries (E1-S4 AC3)
  PB.headers = function (extra) {
    var h = { 'X-Role': PB.session.role };
    if (PB.session.role === 'customer') { h['X-Customer-Id'] = PB.session.customer_id; }
    if (extra) { for (var k in extra) { h[k] = extra[k]; } }
    return h;
  };

  /* ---------- shell ---------- */
  function renderNav() {
    var items = PB.NAV[PB.session.role];
    $('nav-list').innerHTML = items.map(function (it) {
      var navHref = typeof cfg.nav === 'function' ? cfg.nav() : cfg.nav;
      var cur = navHref && it.href === navHref ? ' aria-current="page"' : '';
      return '<li><a href="' + it.href + '" data-route="' + it.route + '"' + cur + '>' + PB.h(it.label) + '</a></li>';
    }).join('');
  }
  function renderCustomerPicker() {
    var wrap = $('customer-wrap'); var sel = $('customer');
    var isCust = PB.session.role === 'customer';
    wrap.hidden = !isCust;
    if (!isCust) { return; }
    var list = PB.CUSTOMERS.filter(function (c) { return c.role === 'customer'; });
    sel.innerHTML = list.map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === PB.session.customer_id ? ' selected' : '') + '>' + PB.h(c.name) + ' (' + c.id + ')</option>';
    }).join('');
    sel.disabled = false;
    if (cfg.state === 'loading') { sel.innerHTML = '<option>Loading customers…</option>'; sel.disabled = true; }
  }
  function allowed() { return cfg.roles.indexOf(PB.session.role) !== -1; }
  PB.render = function () {
    PB.clearTimers();
    var main = $('main');
    renderNav(); renderCustomerPicker();
    if (!allowed()) {
      var names = cfg.roles.map(function (r) { return r.charAt(0).toUpperCase() + r.slice(1); }).join(' or ');
      var first = PB.NAV[PB.session.role][0];
      main.innerHTML = '<div class="card stack" role="alert"><h1>Not available for this role</h1>' +
        '<p>The <code>' + PB.h(cfg.route) + '</code> screen is for ' + PB.h(names) + '. Calling its API as <code>X-Role: ' + PB.session.role + '</code> returns <code>403 FORBIDDEN</code>.</p>' +
        '<pre class="mono small" style="margin:0;white-space:pre-wrap">' + PB.h(JSON.stringify(PB.errorEnvelope('FORBIDDEN', 'Role ' + PB.session.role + ' cannot access this resource'), null, 2)) + '</pre>' +
        '<p><a class="btn" href="' + first.href + '">Go to ' + PB.h(first.label) + '</a></p></div>';
      return;
    }
    var ctx = { state: cfg.state, role: PB.session.role, customer_id: PB.session.customer_id, rerender: PB.render };
    cfg.render(main, ctx);
  };
  PB.setState = function (s) { cfg.state = s; $('dev-state').value = s; PB.render(); };
  PB.state = function () { return cfg.state; };
  PB.addDev = function (html, onReady) { $('dev-extra').insertAdjacentHTML('beforeend', html); if (onReady) { onReady(); } };
  PB.init = function (c) {
    cfg = c; PB.cfg = c;
    PB.session = loadSession();
    if (cfg.roles.indexOf(PB.session.role) === -1) { PB.session.role = cfg.defaultRole; }
    var st = PB.query('state'); cfg.state = STATE_LABELS[st] && cfg.states.indexOf(st) !== -1 ? st : 'happy';
    document.title = c.id + ' ' + c.title + ' - PayBridge mockup';
    $('role').value = PB.session.role;
    $('dev-state').innerHTML = cfg.states.map(function (s) { return '<option value="' + s + '">' + STATE_LABELS[s] + '</option>'; }).join('');
    $('dev-state').value = cfg.state;
    $('role').addEventListener('change', function (e) {
      PB.session.role = e.target.value; saveSession(); PB.announce('Role changed to ' + e.target.value); PB.render();
    });
    $('customer').addEventListener('change', function (e) {
      PB.session.customer_id = e.target.value; saveSession(); PB.render();
    });
    $('dev-state').addEventListener('change', function (e) { cfg.state = e.target.value; PB.render(); });
    $('dev-api').addEventListener('change', function (e) { document.body.classList.toggle('hide-api', !e.target.checked); });
    saveSession();
    if (cfg.onInit) { cfg.onInit(); }
    PB.render();
    window.addEventListener('hashchange', function () { if (cfg.onHash) { cfg.onHash(); } PB.render(); });
  };
})();

</script>
<script>
(function () {
  'use strict';
  var PB = window.PB, h = PB.h;
  // GET /refunds?state=REQUESTED -> {items:[Refund], total}
  // Refund: {id, payment_id, amount_paise, state, requested_by, decided_by, reason_code, created_at, updated_at}
  PB.refundSeed = function () {
    return [
      { id: 'rfd_2c9f41ab7e03', payment_id: 'pay_4b7e20a1c5d9', amount_paise: 250000, state: 'REQUESTED', requested_by: 'cus_001', decided_by: null, reason_code: null, created_at: '2026-10-04T08:15:00Z', updated_at: '2026-10-04T08:15:00Z' },
      { id: 'rfd_91d07e3a55bc', payment_id: 'pay_8f3a1c9d2b47', amount_paise: 10000050, state: 'REQUESTED', requested_by: 'cus_001', decided_by: null, reason_code: null, created_at: '2026-10-04T09:41:12Z', updated_at: '2026-10-04T09:41:12Z' },
      { id: 'rfd_6be2a10f9d44', payment_id: 'pay_a1b2c3d4e5f6', amount_paise: 7500000, state: 'REQUESTED', requested_by: 'cus_002', decided_by: null, reason_code: null, created_at: '2026-10-04T10:02:48Z', updated_at: '2026-10-04T10:02:48Z' }
    ];
  };
  // Shared refund queue. opts: {items, rowState:{id:{pending}}, caption, outcome(), onChange(items), host}
  PB.refundQueue = function (host, opts) {
    var items = opts.items, busy = {}, err = '', errCode = '';
    function head() { return '<thead><tr><th scope="col">Refund</th><th scope="col">Payment</th><th scope="col" class="num">Amount</th><th scope="col">Requested by</th><th scope="col">State</th><th scope="col">Decision</th></tr></thead>'; }
    function row(r) {
      var actions;
      if (r.state !== 'REQUESTED') { actions = '<span class="muted small">Decided by ' + h(r.decided_by) + '</span>'; }
      else if (busy[r.id]) { actions = '<span class="small"><span class="spinner" aria-hidden="true"></span> ' + h(busy[r.id]) + '…</span>'; }
      else {
        actions = '<div class="row" style="gap:var(--s-2)"><button type="button" class="btn sm" data-act="approve" data-id="' + r.id + '" data-api="POST /refunds/' + r.id + '/approve">Approve<span class="sr-only"> refund for payment ' + r.payment_id + '</span></button>' +
          '<button type="button" class="btn danger sm" data-act="reject" data-id="' + r.id + '" data-api="POST /refunds/' + r.id + '/reject">Reject<span class="sr-only"> refund for payment ' + r.payment_id + '</span></button></div>';
      }
      return '<tr data-id="' + r.id + '"><td class="mono" data-label="Refund">' + r.id + '</td><td class="mono" data-label="Payment" data-field="payment_id">' + r.payment_id + '</td>' +
        '<td class="num money" data-label="Amount" data-field="amount_paise">' + PB.fmtRs(r.amount_paise) + '</td><td data-label="Requested by" data-field="requested_by" class="mono">' + r.requested_by + '</td>' +
        '<td data-label="State" data-field="state">' + PB.badge('refund', r.state) + '</td><td data-label="Decision">' + actions + '</td></tr>';
    }
    function draw() {
      var html;
      if (!items.length) { html = '<div style="text-align:center;padding:var(--s-6) var(--s-4)"><h3>No refunds pending</h3><p class="secondary">Requested refunds appear here for approval.</p></div>'; }
      else { html = '<div class="table-wrap"><table class="data stack"><caption>' + h(opts.caption) + ' ' + PB.api('GET /refunds?state=REQUESTED') + '</caption>' + head() + '<tbody>' + items.map(row).join('') + '</tbody></table></div>'; }
      var pendingCount = items.filter(function (r) { return r.state === 'REQUESTED'; }).length;
      if (opts.mode === 'loading') { html = '<div class="table-wrap" aria-busy="true"><table class="data stack"><caption>' + h(opts.caption) + '</caption>' + head() + '<tbody>' + PB.skeletonRows(6, 3) + '</tbody></table></div>'; }
      host.innerHTML = '<div id="rq-alert" role="alert">' + (err ? '<div class="banner error" style="margin:var(--s-3)"><span class="msg"><strong>' + errCode + '.</strong> ' + h(err) + '</span></div>' : '') + '</div>' + html;
      if (opts.onChange) { opts.onChange(items, pendingCount); }
      Array.prototype.forEach.call(host.querySelectorAll('[data-act]'), function (b) { b.addEventListener('click', function () { decide(b.getAttribute('data-id'), b.getAttribute('data-act'), b); }); });
    }
    function decide(id, act, btn) {
      busy[id] = act === 'approve' ? 'Approving' : 'Rejecting'; err = ''; errCode = ''; draw();
      PB.after(800, function () {
        delete busy[id]; var mode = opts.outcome();
        var r = items.filter(function (x) { return x.id === id; })[0];
        if (mode === '409') { err = 'This refund was already decided'; errCode = '409 REFUND_ALREADY_DECIDED'; r.state = act === 'approve' ? 'REJECTED' : 'EXECUTED'; r.decided_by = 'cus_005'; draw(); PB.announce(err); return; }
        if (mode === '500') { err = 'Something went wrong. Please try again.'; errCode = '500 INTERNAL_ERROR'; draw(); return; }
        r.state = act === 'approve' ? 'EXECUTED' : 'REJECTED'; if (r.state === 'REJECTED') { r.reason_code = 'REJECTED_BY_ADMIN'; } r.decided_by = 'cus_005'; r.updated_at = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
        draw(); PB.announce('Refund for payment ' + r.payment_id + ' is now ' + r.state);
      });
    }
    draw();
  };
})();

</script>
<script>
(function () {
  'use strict';
  var PB = window.PB, h = PB.h;
  var seedDate = PB.todayIST(), date = seedDate, outcome = 'ok', failing = 'status', failed = {}, refunds = null, lastState = null;
  // GET /dashboard/summary?date= -> {date, rails:[{rail,payment_count,total_paise}], status_counts, pending_refunds:[Refund], settlement_files:[SettlementFile]}
  var RAILS = [{ rail: 'UPI', payment_count: 42, total_paise: 185450075 }, { rail: 'IMPS', payment_count: 9, total_paise: 132500050 }, { rail: 'NEFT', payment_count: 5, total_paise: 175000000 }, { rail: 'RTGS', payment_count: 3, total_paise: 1850000000 }];
  var ZERO_RAILS = ['UPI', 'IMPS', 'NEFT', 'RTGS'].map(function (r) { return { rail: r, payment_count: 0, total_paise: 0 }; });
  var STATUS = { CREATED: 2, SUBMITTED: 4, COMPLETED: 49, FAILED: 4 };
  var FILES = [
    { id: 'stl_7a1c9e03b5d2', business_date: seedDate, kind: 'primary', row_count: 58, checksum: '29feef9ac910531f2319d5809a36cdbb4bbc6f2bec378a8c88dc2f2e0559a844', written_at: seedDate + 'T18:29:00Z' },
    { id: 'stl_e40b6d2917fa', business_date: seedDate, kind: 'followup', row_count: 3, checksum: '5d6b3fbec47dc9df02c9f5ef5c67fb1c7f07012a8a7432482ec5711ace654724', written_at: seedDate + 'T20:10:22Z' }
  ];
  function hasActivity(ctx) { return ctx.state !== 'empty' && date === seedDate; }
  function tile(key, title, api, inner, ctx) {
    var bad = ctx.state === 'error' && failing === key && !failed[key];
    var body = ctx.state === 'loading' ? '<div aria-busy="true"><span class="skel tall"></span><br><span class="skel w60"></span></div>'
      : bad ? '<div class="banner error" role="alert"><span class="msg"><strong>Could not load ' + h(title.toLowerCase()) + '.</strong> Internal server error (INTERNAL_ERROR).</span><button type="button" class="btn secondary sm" data-retry="' + key + '">Retry ' + h(title.toLowerCase()) + '</button></div>' : inner;
    return '<section class="card" data-tile="' + key + '" aria-labelledby="t-' + key + '"><h2 id="t-' + key + '" style="font-size:var(--fs-lg)">' + h(title) + ' ' + PB.api(api) + '</h2>' + body + '</section>';
  }
  function railTiles(rails) {
    return '<div class="grid cols-4">' + rails.map(function (r) {
      return '<div class="tile" data-rail="' + r.rail + '"><div class="k">' + r.rail + '</div><div class="v money" data-field="total_paise">' + PB.fmtRs(r.total_paise) + '</div><div class="s"><span data-field="payment_count">' + r.payment_count + '</span> payment' + (r.payment_count === 1 ? '' : 's') + '</div></div>';
    }).join('') + '</div>';
  }
  function statusTiles(sc) {
    return '<div class="grid cols-4">' + ['CREATED', 'SUBMITTED', 'COMPLETED', 'FAILED'].map(function (s) {
      return '<div class="tile" data-status="' + s + '"><div class="k">' + PB.badge('state', s) + '</div><div class="v" data-field="status_counts.' + s + '">' + sc[s] + '</div><div class="s">payments ' + s.toLowerCase() + '</div></div>';
    }).join('') + '</div>';
  }
  function filesTable(files) {
    if (!files.length) { return '<p class="secondary">No settlement files yet</p>'; }
    return '<div class="table-wrap"><table class="data stack"><caption class="sr-only">Settlement reports for ' + date + '</caption><thead><tr><th scope="col">Business date</th><th scope="col">Kind</th><th scope="col" class="num">Rows</th><th scope="col">Written</th></tr></thead><tbody>' + files.map(function (f) {
      return '<tr><td data-label="Business date">' + f.business_date + '</td><td data-label="Kind">' + PB.badge('kind', f.kind) + '</td><td class="num" data-label="Rows">' + f.row_count + '</td><td data-label="Written">' + PB.fmtTime(f.written_at) + '</td></tr>';
    }).join('') + '</tbody></table></div><p class="small" style="margin-top:var(--s-2)"><a href="E7-S3.html" data-route="/settlement">Open settlement files</a></p>';
  }
  function render(root, ctx) {
    if (!refunds || lastState !== ctx.state) { refunds = hasActivity(ctx) ? PB.refundSeed() : []; failed = {}; }
    lastState = ctx.state;
    var act = hasActivity(ctx);
    root.innerHTML = '<div class="page-head"><div><h1>Dashboard</h1><p>Daily volumes, status breakdown, refund queue and settlement reports.</p></div>' +
      '<div class="field"><label for="date">Date (IST)</label><input class="input" type="date" id="date" name="date" value="' + date + '" style="width:auto"><span class="api-tag">GET /dashboard/summary?date=' + date + '</span></div></div>' +
      '<div class="stack">' + (ctx.state !== 'loading' && !act ? '<div class="banner info" role="status" id="no-activity"><span class="msg"><strong>No activity for this date.</strong> All values below are zero.</span></div>' : '') +
      tile('rails', 'Volume by rail', 'rails[]', railTiles(act ? RAILS : ZERO_RAILS), ctx) +
      tile('status', 'Status breakdown', 'status_counts', statusTiles(act ? STATUS : { CREATED: 0, SUBMITTED: 0, COMPLETED: 0, FAILED: 0 }), ctx) +
      '<section class="card flush" data-tile="refunds" aria-labelledby="t-refunds"><div style="padding:var(--s-5) var(--s-5) 0"><h2 id="t-refunds" style="font-size:var(--fs-lg)">Refund queue ' + PB.api('pending_refunds[]') + '</h2><p class="small secondary" style="margin-top:var(--s-1)"><span id="pending-count" data-field="pending_refunds.length">0</span> pending</p></div><div id="queue"></div></section>' +
      tile('files', 'Settlement reports', 'settlement_files[]', filesTable(act ? FILES : []), ctx) + '</div>';
    PB.$('date').addEventListener('change', function (e) { date = e.target.value || seedDate; refunds = null; PB.render(); PB.$('date').focus(); });
    Array.prototype.forEach.call(root.querySelectorAll('[data-retry]'), function (b) {
      b.addEventListener('click', function () { var k = b.getAttribute('data-retry'); b.disabled = true; b.textContent = 'Retrying…'; PB.after(700, function () { failed[k] = true; var keep = refunds; PB.render(); PB.announce('Tile reloaded'); }); });
    });
    PB.refundQueue(PB.$('queue'), {
      items: refunds, caption: 'Refunds awaiting decision', mode: ctx.state === 'loading' ? 'loading' : '', outcome: function () { return outcome; },
      onChange: function (items, n) { var c = PB.$('pending-count'); if (c) { c.textContent = n; } }
    });
  }
  PB.init({
    id: 'E8-S2', title: 'Admin dashboard', route: '/dashboard', roles: ['admin'], defaultRole: 'admin', nav: 'E8-S2.html', states: ['happy', 'empty', 'loading', 'error'], render: render,
    onInit: function () {
      PB.addDev('<label>Failing tile (Error state) <select id="dev-tile" aria-label="Failing tile"><option value="status">Status breakdown</option><option value="rails">Volume by rail</option><option value="files">Settlement reports</option></select></label>' +
        '<label>Decision outcome <select id="dev-out" aria-label="Decision outcome"><option value="ok">200 Refund updated</option><option value="409">409 REFUND_ALREADY_DECIDED</option><option value="500">500 INTERNAL_ERROR</option></select></label>');
      PB.$('dev-tile').addEventListener('change', function (e) { failing = e.target.value; failed = {}; PB.render(); });
      PB.$('dev-out').addEventListener('change', function (e) { outcome = e.target.value; });
    }
  });
})();

</script>
