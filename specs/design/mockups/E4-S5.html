<script>
(function () {
  'use strict';
  var PB = (window.PB = {});
  // GET /customers -> {items:[{id,name,role}], total}
  PB.CUSTOMERS = [
    { id: 'cus_001', name: 'Aarav Mehta', role: 'customer' },
    { id: 'cus_002', name: 'Priya Nair', role: 'customer' },
    { id: 'cus_003', name: 'Rohan Iyer', role: 'customer' },
    { id: 'cus_004', name: 'Meera Kapoor', role: 'ops' },
    { id: 'cus_005', name: 'Vikram Rao', role: 'admin' }
  ];
  PB.NAV = {
    customer: [{ label: 'Payments', route: '/payments', href: 'E3-S2.html' }],
    ops: [
      { label: 'Reconciliation', route: '/reconciliation', href: 'E6-S3.html' },
      { label: 'Stuck payments', route: '/stuck-payments', href: 'E4-S5.html#stuck' }
    ],
    admin: [
      { label: 'Dashboard', route: '/dashboard', href: 'E8-S2.html' },
      { label: 'Settlement', route: '/settlement', href: 'E7-S3.html' },
      { label: 'Simulation', route: '/simulation', href: 'E4-S5.html#simulation' }
    ]
  };
  var STATE_LABELS = { happy: 'Happy path', empty: 'Empty', loading: 'Loading (skeleton)', error: 'Error' };
  var LS_KEY = 'paybridge.session';
  var timers = [];
  var cfg = null;
  var $ = function (id) { return document.getElementById(id); };
  PB.$ = $;

  /* ---------- helpers ---------- */
  PB.h = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  // Integer paise -> 'Rs 1,00,000.50' (Indian grouping). Integer math and string ops only.
  PB.fmtRs = function (paise) {
    if (!Number.isInteger(paise)) { throw new Error('amount_paise must be an integer'); }
    var neg = paise < 0; var p = Math.abs(paise);
    var rupees = String(Math.floor(p / 100));
    var pa = String(p % 100); if (pa.length < 2) { pa = '0' + pa; }
    var out = rupees;
    if (rupees.length > 3) {
      var rest = rupees.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
      out = rest + ',' + rupees.slice(-3);
    }
    return (neg ? '-' : '') + 'Rs ' + out + '.' + pa;
  };
  // Rupee string -> paise by string parsing (no floating point).
  PB.parseRupees = function (input) {
    var s = String(input).trim().replace(/^(rs\.?|₹)\s*/i, '').replace(/[,\s]/g, '');
    if (s === '') { return { ok: false, empty: true, message: 'Enter an amount in rupees' }; }
    var neg = false;
    if (s.charAt(0) === '-') { neg = true; s = s.slice(1); } else if (s.charAt(0) === '+') { s = s.slice(1); }
    var m = /^(\d+)(?:\.(\d*))?$/.exec(s);
    if (!m) { return { ok: false, message: 'Enter a valid amount in rupees, for example 1,00,000.50' }; }
    var frac = m[2] || '';
    if (frac.length > 2) { return { ok: false, message: 'Use at most two decimal places' }; }
    if (m[1].length > 13) { return { ok: false, message: 'Amount is too large' }; }
    var paise = parseInt(m[1], 10) * 100 + parseInt((frac + '00').slice(0, 2), 10);
    if (neg) { paise = -paise; }
    if (paise < 100) { return { ok: false, paise: paise, message: 'Amount must be at least Rs 1' }; }
    return { ok: true, paise: paise };
  };
  // Routing bands, BRD 5.3 (upper bounds inclusive)
  PB.routeRail = function (paise) {
    if (paise < 100) { return null; }
    if (paise <= 10000000) { return 'UPI'; }
    if (paise <= 20000000) { return 'IMPS'; }
    if (paise <= 50000000) { return 'NEFT'; }
    return 'RTGS';
  };
  PB.fmtTime = function (iso) {
    return new Intl.DateTimeFormat('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso)) + ' IST';
  };
  PB.fmtClock = function (d) {
    return new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(d);
  };
  PB.fmtAge = function (sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min ' + s + ' s');
  };
  PB.todayIST = function () {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date());
  };
  PB.uuid = function () {
    if (window.crypto && crypto.randomUUID) { return crypto.randomUUID(); }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0; return (c === 'x' ? r : (r & 3) | 8).toString(16);
    });
  };
  var BADGES = {
    state: { CREATED: ['neutral', '○'], SUBMITTED: ['info', '◐'], COMPLETED: ['success', '✓'], FAILED: ['danger', '✕'] },
    refund: { REQUESTED: ['warn', '◐'], APPROVED: ['info', '✓'], EXECUTED: ['success', '✓'], REJECTED: ['danger', '✕'], FAILED: ['danger', '✕'] },
    recon: { matched: ['success', '✓'], unmatched_internal: ['warn', '!'], unmatched_external: ['warn', '!'], amount_mismatch: ['danger', '≠'] },
    outcome: { success: ['success', '✓'], transient: ['warn', '↻'], permanent: ['danger', '✕'] },
    kind: { primary: ['info', '1'], followup: ['neutral', '+'] },
    mode: { success: ['success', '✓'], permanent_failure: ['danger', '✕'], transient: ['warn', '↻'] }
  };
  // Badge: the enum value is always rendered as text; the glyph is decorative.
  PB.badge = function (type, value) {
    var d = (BADGES[type] || {})[value] || ['neutral', '•'];
    return '<span class="badge ' + d[0] + '" data-' + type + '="' + PB.h(value) + '"><span class="g" aria-hidden="true">' + d[1] + '</span>' + PB.h(value) + '</span>';
  };
  PB.api = function (label) { return '<span class="api-tag">' + PB.h(label) + '</span>'; };
  PB.skeletonRows = function (cols, n) {
    var html = '';
    for (var i = 0; i < n; i++) {
      html += '<tr aria-hidden="true">';
      for (var c = 0; c < cols; c++) { html += '<td><span class="skel ' + (c % 2 ? 'w60' : '') + '"></span></td>'; }
      html += '</tr>';
    }
    return html;
  };
  PB.retryBanner = function (message, id, extra) {
    return '<div class="banner error" role="alert" ' + (extra || '') + '><span class="msg"><strong>Something went wrong.</strong> ' + PB.h(message) + '</span><button type="button" class="btn secondary sm" id="' + (id || 'retry') + '">Retry</button></div>';
  };
  PB.announce = function (msg) {
    var l = $('live'); l.textContent = ''; window.setTimeout(function () { l.textContent = msg; }, 30);
  };
  PB.after = function (ms, fn) { var t = window.setTimeout(fn, ms); timers.push(t); return t; };
  PB.every = function (ms, fn) { var t = window.setInterval(fn, ms); timers.push(t); return t; };
  PB.clearTimers = function () { timers.forEach(function (t) { window.clearTimeout(t); window.clearInterval(t); }); timers = []; };
  PB.query = function (k) { return new URLSearchParams(window.location.search).get(k); };
  PB.errorEnvelope = function (code, message, fields) {
    var e = { error: { code: code, message: message } }; if (fields) { e.error.fields = fields; } return e;
  };

  /* ---------- session ---------- */
  function loadSession() {
    var s = null;
    try { s = JSON.parse(window.localStorage.getItem(LS_KEY)); } catch (e) { s = null; }
    var q = PB.query('role');
    if (q && PB.NAV[q]) { s = { role: q, customer_id: (s && s.customer_id) || 'cus_001' }; }
    if (!s || !PB.NAV[s.role]) { s = { role: 'customer', customer_id: 'cus_001' }; }
    return s;
  }
  function saveSession() { try { window.localStorage.setItem(LS_KEY, JSON.stringify(PB.session)); } catch (e) { /* storage blocked */ } }
  // Headers every API request carries (E1-S4 AC3)
  PB.headers = function (extra) {
    var h = { 'X-Role': PB.session.role };
    if (PB.session.role === 'customer') { h['X-Customer-Id'] = PB.session.customer_id; }
    if (extra) { for (var k in extra) { h[k] = extra[k]; } }
    return h;
  };

  /* ---------- shell ---------- */
  function renderNav() {
    var items = PB.NAV[PB.session.role];
    $('nav-list').innerHTML = items.map(function (it) {
      var navHref = typeof cfg.nav === 'function' ? cfg.nav() : cfg.nav;
      var cur = navHref && it.href === navHref ? ' aria-current="page"' : '';
      return '<li><a href="' + it.href + '" data-route="' + it.route + '"' + cur + '>' + PB.h(it.label) + '</a></li>';
    }).join('');
  }
  function renderCustomerPicker() {
    var wrap = $('customer-wrap'); var sel = $('customer');
    var isCust = PB.session.role === 'customer';
    wrap.hidden = !isCust;
    if (!isCust) { return; }
    var list = PB.CUSTOMERS.filter(function (c) { return c.role === 'customer'; });
    sel.innerHTML = list.map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === PB.session.customer_id ? ' selected' : '') + '>' + PB.h(c.name) + ' (' + c.id + ')</option>';
    }).join('');
    sel.disabled = false;
    if (cfg.state === 'loading') { sel.innerHTML = '<option>Loading customers…</option>'; sel.disabled = true; }
  }
  function allowed() { return cfg.roles.indexOf(PB.session.role) !== -1; }
  PB.render = function () {
    PB.clearTimers();
    var main = $('main');
    renderNav(); renderCustomerPicker();
    if (!allowed()) {
      var names = cfg.roles.map(function (r) { return r.charAt(0).toUpperCase() + r.slice(1); }).join(' or ');
      var first = PB.NAV[PB.session.role][0];
      main.innerHTML = '<div class="card stack" role="alert"><h1>Not available for this role</h1>' +
        '<p>The <code>' + PB.h(cfg.route) + '</code> screen is for ' + PB.h(names) + '. Calling its API as <code>X-Role: ' + PB.session.role + '</code> returns <code>403 FORBIDDEN</code>.</p>' +
        '<pre class="mono small" style="margin:0;white-space:pre-wrap">' + PB.h(JSON.stringify(PB.errorEnvelope('FORBIDDEN', 'Role ' + PB.session.role + ' cannot access this resource'), null, 2)) + '</pre>' +
        '<p><a class="btn" href="' + first.href + '">Go to ' + PB.h(first.label) + '</a></p></div>';
      return;
    }
    var ctx = { state: cfg.state, role: PB.session.role, customer_id: PB.session.customer_id, rerender: PB.render };
    cfg.render(main, ctx);
  };
  PB.setState = function (s) { cfg.state = s; $('dev-state').value = s; PB.render(); };
  PB.state = function () { return cfg.state; };
  PB.addDev = function (html, onReady) { $('dev-extra').insertAdjacentHTML('beforeend', html); if (onReady) { onReady(); } };
  PB.init = function (c) {
    cfg = c; PB.cfg = c;
    PB.session = loadSession();
    if (cfg.roles.indexOf(PB.session.role) === -1) { PB.session.role = cfg.defaultRole; }
    var st = PB.query('state'); cfg.state = STATE_LABELS[st] && cfg.states.indexOf(st) !== -1 ? st : 'happy';
    document.title = c.id + ' ' + c.title + ' - PayBridge mockup';
    $('role').value = PB.session.role;
    $('dev-state').innerHTML = cfg.states.map(function (s) { return '<option value="' + s + '">' + STATE_LABELS[s] + '</option>'; }).join('');
    $('dev-state').value = cfg.state;
    $('role').addEventListener('change', function (e) {
      PB.session.role = e.target.value; saveSession(); PB.announce('Role changed to ' + e.target.value); PB.render();
    });
    $('customer').addEventListener('change', function (e) {
      PB.session.customer_id = e.target.value; saveSession(); PB.render();
    });
    $('dev-state').addEventListener('change', function (e) { cfg.state = e.target.value; PB.render(); });
    $('dev-api').addEventListener('change', function (e) { document.body.classList.toggle('hide-api', !e.target.checked); });
    saveSession();
    if (cfg.onInit) { cfg.onInit(); }
    PB.render();
    window.addEventListener('hashchange', function () { if (cfg.onHash) { cfg.onHash(); } PB.render(); });
  };
})();

</script>
<script>
(function () {
  'use strict';
  var PB = window.PB, h = PB.h;
  var outcome = 'ok';
  var REASONS = ['INSUFFICIENT_FUNDS', 'INVALID_BENEFICIARY', 'BENEFICIARY_ACCOUNT_CLOSED', 'LIMIT_EXCEEDED'];
  var MODES = [['success', 'Success'], ['permanent_failure', 'Permanent failure'], ['transient', 'Transient failure']];
  // GET /admin/simulation -> {items:[{rail, mode, reason_code, transient_failure_rate}]}
  var sim = [
    { rail: 'UPI', mode: 'success', reason_code: null, transient_failure_rate: 0 },
    { rail: 'IMPS', mode: 'permanent_failure', reason_code: 'LIMIT_EXCEEDED', transient_failure_rate: 0 },
    { rail: 'NEFT', mode: 'transient', reason_code: null, transient_failure_rate: 0.3 },
    { rail: 'RTGS', mode: 'success', reason_code: null, transient_failure_rate: 0 }
  ];
  // GET /ops/stuck-payments -> {items:[{payment_id, rail, amount_paise, submitted_at, flagged_at, age_seconds}], total}
  var stuck = [
    { payment_id: 'pay_c1d2e3f4a5b6', rail: 'RTGS', amount_paise: 62500000, submitted_at: '2026-10-04T10:05:14Z', flagged_at: '2026-10-04T10:10:20Z', age_seconds: 742 },
    { payment_id: 'pay_d2e3f4a5b6c7', rail: 'NEFT', amount_paise: 31500000, submitted_at: '2026-10-04T09:48:02Z', flagged_at: '2026-10-04T09:53:10Z', age_seconds: 1315 },
    { payment_id: 'pay_e3f4a5b6c7d8', rail: 'IMPS', amount_paise: 10000050, submitted_at: '2026-10-04T08:31:40Z', flagged_at: '2026-10-04T08:36:50Z', age_seconds: 5290 }
  ];
  function view() {
    var hsh = window.location.hash.replace('#', '');
    if (hsh === 'simulation' || hsh === 'stuck') { return hsh; }
    return PB.session.role === 'admin' ? 'simulation' : 'stuck';
  }
  function forbidden(root, v) {
    var first = PB.NAV[PB.session.role][0];
    root.innerHTML = '<div class="card stack" role="alert"><h1>Not available for this role</h1><p>The Simulation screen is for Admin. <code>/admin/simulation</code> returns <code>403 FORBIDDEN</code> for <code>X-Role: ' + PB.session.role + '</code>.</p><p><a class="btn" href="' + first.href + '">Go to ' + h(first.label) + '</a></p></div>';
  }
  /* ---------- Simulation ---------- */
  function card(c, ctx) {
    var r = c.rail;
    var radios = MODES.map(function (m) {
      return '<div class="radio"><input type="radio" id="mode-' + r + '-' + m[0] + '" name="mode-' + r + '" value="' + m[0] + '"' + (c.mode === m[0] ? ' checked' : '') + '><label for="mode-' + r + '-' + m[0] + '">' + m[1] + '</label></div>';
    }).join('');
    var opts = '<option value="">Select a reason code</option>' + REASONS.map(function (x) { return '<option value="' + x + '"' + (c.reason_code === x ? ' selected' : '') + '>' + x + '</option>'; }).join('');
    return '<form class="card stack" data-rail="' + r + '" novalidate aria-labelledby="h-' + r + '" data-api="PUT /admin/simulation/' + r + '">' +
      '<div class="row" style="justify-content:space-between"><h2 id="h-' + r + '" style="font-size:var(--fs-lg)">' + r + '</h2><span data-current>' + PB.badge('mode', c.mode) + '</span></div>' +
      '<fieldset class="field"><legend>' + r + ' mode</legend>' + radios + '</fieldset>' +
      '<div class="field"><label for="reason-' + r + '">Reason code (used for permanent failure)</label><select class="input" id="reason-' + r + '" name="reason_code">' + opts + '</select><span id="reason-err-' + r + '"></span></div>' +
      '<div class="field"><label for="rate-' + r + '">Transient failure rate (0 to 1)</label><input class="input" id="rate-' + r + '" name="transient_failure_rate" inputmode="decimal" autocomplete="off" value="' + c.transient_failure_rate + '" aria-describedby="rate-hint-' + r + ' rate-err-' + r + '"><span class="hint" id="rate-hint-' + r + '">Share of attempts that fail with a transient error, for example 0.25.</span><span id="rate-err-' + r + '"></span></div>' +
      '<div class="row"><button type="submit" class="btn" data-save="' + r + '">Save ' + r + '<span class="sr-only"> simulation</span></button>' + PB.api('PUT /admin/simulation/' + r) + '</div>' +
      '<div role="status" aria-live="polite" id="conf-' + r + '"></div></form>';
  }
  function validRate(v) { var s = v.trim(); if (!/^(\d+\.?\d*|\.\d+)$/.test(s)) { return null; } var n = Number(s); return n >= 0 && n <= 1 ? n : null; }
  function bindCard(form) {
    var r = form.getAttribute('data-rail'); var c = sim.filter(function (x) { return x.rail === r; })[0];
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var mode = form.querySelector('input[name="mode-' + r + '"]:checked').value;
      var reason = form.querySelector('#reason-' + r).value, rateIn = form.querySelector('#rate-' + r), re = PB.$('rate-err-' + r), ee = PB.$('reason-err-' + r);
      re.innerHTML = ''; ee.innerHTML = ''; rateIn.removeAttribute('aria-invalid'); form.querySelector('#reason-' + r).removeAttribute('aria-invalid'); PB.$('conf-' + r).innerHTML = '';
      var rate = validRate(rateIn.value), bad = false;
      if (rate === null) { re.innerHTML = '<span class="field-error" role="alert" data-field="transient_failure_rate">Enter a rate between 0 and 1</span>'; rateIn.setAttribute('aria-invalid', 'true'); rateIn.focus(); bad = true; }
      if (mode === 'permanent_failure' && !reason) { ee.innerHTML = '<span class="field-error" role="alert" data-field="reason_code">Select a reason code for permanent failure</span>'; form.querySelector('#reason-' + r).setAttribute('aria-invalid', 'true'); if (!bad) { form.querySelector('#reason-' + r).focus(); } bad = true; }
      if (bad) { return; }  // no API call
      var btn = form.querySelector('[data-save]'); btn.disabled = true; btn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Saving ' + r + '…';
      PB.after(700, function () {
        btn.disabled = false; btn.innerHTML = 'Save ' + r + '<span class="sr-only"> simulation</span>';
        if (outcome === '500') { PB.$('conf-' + r).innerHTML = '<div class="banner error" role="alert"><span class="msg"><strong>500 INTERNAL_ERROR.</strong> Could not save ' + r + '. Please try again.</span></div>'; return; }
        c.mode = mode; c.reason_code = mode === 'permanent_failure' ? reason : null; c.transient_failure_rate = rate;
        form.querySelector('[data-current]').innerHTML = PB.badge('mode', mode);
        PB.$('conf-' + r).innerHTML = '<div class="banner success"><span class="msg"><strong>Saved.</strong> ' + r + ' simulation is now <span class="mono">' + h(JSON.stringify({ mode: mode, reason_code: c.reason_code, transient_failure_rate: rate })) + '</span></span></div>';
      });
    });
  }
  function simulation(root, ctx) {
    var body;
    if (ctx.state === 'loading') { body = '<div class="grid cols-2" aria-busy="true">' + [1, 2, 3, 4].map(function () { return '<div class="card"><span class="skel tall w40"></span><br><span class="skel"></span><br><span class="skel w60"></span><br><span class="skel"></span></div>'; }).join('') + '</div>'; }
    else if (ctx.state === 'error') { body = PB.retryBanner('Could not load simulation settings: Internal server error (INTERNAL_ERROR).', 'retry'); }
    else { body = '<div class="grid cols-2">' + sim.map(function (c) { return card(c, ctx); }).join('') + '</div>'; }
    root.innerHTML = '<div class="page-head"><div><h1>Simulation</h1><p>Control how each mock rail behaves. Changes apply to new submissions.</p></div><span class="route">/simulation ' + PB.api('GET /admin/simulation') + '</span></div>' + body;
    Array.prototype.forEach.call(root.querySelectorAll('form[data-rail]'), bindCard);
  }
  /* ---------- Stuck payments ---------- */
  function stuckView(root, ctx) {
    var list = ctx.state === 'empty' ? [] : stuck, inner;
    if (ctx.state === 'error') { inner = PB.retryBanner('Could not load stuck payments: Internal server error (INTERNAL_ERROR).', 'retry'); }
    else if (ctx.state !== 'loading' && !list.length) { inner = '<div class="card" style="text-align:center;padding:var(--s-7) var(--s-4)"><h2>No stuck payments</h2><p class="secondary">Payments in SUBMITTED for more than 5 minutes appear here.</p></div>'; }
    else {
      inner = '<section class="card flush" ' + (ctx.state === 'loading' ? 'aria-busy="true"' : '') + '><div class="table-wrap"><table class="data stack"><caption>Stuck payments ' + PB.api('GET /ops/stuck-payments') + '</caption><thead><tr><th scope="col">Payment</th><th scope="col">Rail</th><th scope="col" class="num">Amount</th><th scope="col">Submitted</th><th scope="col">Flagged</th><th scope="col" class="num">Age</th></tr></thead><tbody>' +
        (ctx.state === 'loading' ? PB.skeletonRows(6, 4) : list.map(function (s) {
          return '<tr><td class="mono" data-label="Payment" data-field="payment_id">' + s.payment_id + '</td><td data-label="Rail" data-field="rail">' + s.rail + '</td><td class="num money" data-label="Amount" data-field="amount_paise">' + PB.fmtRs(s.amount_paise) + '</td>' +
            '<td data-label="Submitted" data-field="submitted_at">' + PB.fmtTime(s.submitted_at) + '</td><td data-label="Flagged" data-field="flagged_at">' + PB.fmtTime(s.flagged_at) + '</td>' +
            '<td class="num" data-label="Age" data-field="age_seconds"><span class="badge warn"><span class="g" aria-hidden="true">!</span>STUCK</span> ' + PB.fmtAge(s.age_seconds) + '</td></tr>';
        }).join('')) + '</tbody></table></div></section>';
    }
    root.innerHTML = '<div class="page-head"><div><h1>Stuck payments</h1><p>Payments in SUBMITTED for more than 5 minutes, flagged for review.</p></div><span class="route">/stuck-payments</span></div><div class="stack">' + inner + '</div>';
  }
  function render(root, ctx) {
    var v = view();
    if (v === 'simulation' && ctx.role !== 'admin') { forbidden(root, v); return; }
    (v === 'simulation' ? simulation : stuckView)(root, ctx);
    var r = PB.$('retry'); if (r) { r.addEventListener('click', function () { PB.setState('loading'); PB.after(800, function () { PB.setState('happy'); }); }); }
  }
  PB.init({
    id: 'E4-S5', title: 'Simulation and stuck payments', route: '/simulation', roles: ['ops', 'admin'], defaultRole: 'admin',
    nav: function () { return 'E4-S5.html#' + view(); }, states: ['happy', 'empty', 'loading', 'error'], render: render,
    onInit: function () {
      PB.addDev('<label>Save outcome <select id="dev-out" aria-label="Save outcome"><option value="ok">200 rail config</option><option value="500">500 INTERNAL_ERROR</option></select></label>');
      PB.$('dev-out').addEventListener('change', function (e) { outcome = e.target.value; });
    }
  });
})();

</script>
