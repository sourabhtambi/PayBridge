<script>
(function () {
  'use strict';
  var PB = (window.PB = {});
  // GET /customers -> {items:[{id,name,role}], total}
  PB.CUSTOMERS = [
    { id: 'cus_001', name: 'Aarav Mehta', role: 'customer' },
    { id: 'cus_002', name: 'Priya Nair', role: 'customer' },
    { id: 'cus_003', name: 'Rohan Iyer', role: 'customer' },
    { id: 'cus_004', name: 'Meera Kapoor', role: 'ops' },
    { id: 'cus_005', name: 'Vikram Rao', role: 'admin' }
  ];
  PB.NAV = {
    customer: [{ label: 'Payments', route: '/payments', href: 'E3-S2.html' }],
    ops: [
      { label: 'Reconciliation', route: '/reconciliation', href: 'E6-S3.html' },
      { label: 'Stuck payments', route: '/stuck-payments', href: 'E4-S5.html#stuck' }
    ],
    admin: [
      { label: 'Dashboard', route: '/dashboard', href: 'E8-S2.html' },
      { label: 'Settlement', route: '/settlement', href: 'E7-S3.html' },
      { label: 'Simulation', route: '/simulation', href: 'E4-S5.html#simulation' }
    ]
  };
  var STATE_LABELS = { happy: 'Happy path', empty: 'Empty', loading: 'Loading (skeleton)', error: 'Error' };
  var LS_KEY = 'paybridge.session';
  var timers = [];
  var cfg = null;
  var $ = function (id) { return document.getElementById(id); };
  PB.$ = $;

  /* ---------- helpers ---------- */
  PB.h = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  // Integer paise -> 'Rs 1,00,000.50' (Indian grouping). Integer math and string ops only.
  PB.fmtRs = function (paise) {
    if (!Number.isInteger(paise)) { throw new Error('amount_paise must be an integer'); }
    var neg = paise < 0; var p = Math.abs(paise);
    var rupees = String(Math.floor(p / 100));
    var pa = String(p % 100); if (pa.length < 2) { pa = '0' + pa; }
    var out = rupees;
    if (rupees.length > 3) {
      var rest = rupees.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
      out = rest + ',' + rupees.slice(-3);
    }
    return (neg ? '-' : '') + 'Rs ' + out + '.' + pa;
  };
  // Rupee string -> paise by string parsing (no floating point).
  PB.parseRupees = function (input) {
    var s = String(input).trim().replace(/^(rs\.?|₹)\s*/i, '').replace(/[,\s]/g, '');
    if (s === '') { return { ok: false, empty: true, message: 'Enter an amount in rupees' }; }
    var neg = false;
    if (s.charAt(0) === '-') { neg = true; s = s.slice(1); } else if (s.charAt(0) === '+') { s = s.slice(1); }
    var m = /^(\d+)(?:\.(\d*))?$/.exec(s);
    if (!m) { return { ok: false, message: 'Enter a valid amount in rupees, for example 1,00,000.50' }; }
    var frac = m[2] || '';
    if (frac.length > 2) { return { ok: false, message: 'Use at most two decimal places' }; }
    if (m[1].length > 13) { return { ok: false, message: 'Amount is too large' }; }
    var paise = parseInt(m[1], 10) * 100 + parseInt((frac + '00').slice(0, 2), 10);
    if (neg) { paise = -paise; }
    if (paise < 100) { return { ok: false, paise: paise, message: 'Amount must be at least Rs 1' }; }
    return { ok: true, paise: paise };
  };
  // Routing bands, BRD 5.3 (upper bounds inclusive)
  PB.routeRail = function (paise) {
    if (paise < 100) { return null; }
    if (paise <= 10000000) { return 'UPI'; }
    if (paise <= 20000000) { return 'IMPS'; }
    if (paise <= 50000000) { return 'NEFT'; }
    return 'RTGS';
  };
  PB.fmtTime = function (iso) {
    return new Intl.DateTimeFormat('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso)) + ' IST';
  };
  PB.fmtClock = function (d) {
    return new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(d);
  };
  PB.fmtAge = function (sec) {
    var m = Math.floor(sec / 60), s = sec % 60;

  };
  PB.todayIST = function () {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date());
  };
  PB.uuid = function () {
    if (window.crypto && crypto.randomUUID) { return crypto.randomUUID(); }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {

    });

  var BADGES = {

    refund: { REQUESTED: ['warn', '◐'], APPROVED: ['info', '✓'], EXECUTED: ['success', '✓'], REJECTED: ['danger', '✕'], FAILED: ['danger', '✕'] },
    recon: { matched: ['success', '✓'], unmatched_internal: ['warn', '!'], unmatched_external: ['warn', '!'], amount_mismatch: ['danger', '≠'] },
    outcome: { success: ['success', '✓'], transient: ['warn', '↻'], permanent: ['danger', '✕'] },
    kind: { primary: ['info', '1'], followup: ['neutral', '+'] },
    mode: { success: ['success', '✓'], permanent_failure: ['danger', '✕'], transient: ['warn', '↻'] }
  };
  // Badge: the enum value is always rendered as text; the glyph is decorative.
  PB.badge = function (type, value) {

  PB.retryBanner = function (message, id, extra) {

  };

    var list = PB.CUSTOMERS.filter(function (c) { return c.role === 'customer'; });

      return '<option value="' + c.id + '"' + (c.id === PB.session.customer_id ? ' selected' : '') + '>' + PB.h(c.name) + ' (' + c.id + ')</option>';

  PB.render = function () {

  PB.addDev = function (html, onReady) { $('dev-extra').insertAdjacentHTML('beforeend', html); if (onReady) { onReady(); } };

    $('dev-state').value = cfg.state;

    saveSession();
    if (cfg.onInit) { cfg.onInit(); }

    window.addEventListener('hashchange', function () { if (cfg.onHash) { cfg.onHash(); } PB.render(); });
  };
})();

    var R = { requested: ['REQUESTED', null], approved: ['APPROVED', null], executed: ['EXECUTED', null], rejected: ['REJECTED', 'REJECTED_BY_ADMIN'], rfailed: ['FAILED', 'LIMIT_EXCEEDED'] };
    if (R[scen]) { p.refund = { id: 'rfd_2c9f41ab7e03', state: R[scen][0], reason_code: R[scen][1] }; }
    if (scen === 'pfailed') { p.state = 'FAILED'; p.reason_code = 'INSUFFICIENT_FUNDS'; p.rail_reference = null; d = JSON.parse(JSON.stringify(PB.DETAILS.pay_91ab33cc0de1)); }
    if (scen === 'psub') { p.state = 'SUBMITTED'; p.rail_reference = null; d = JSON.parse(JSON.stringify(PB.DETAILS.pay_c1d2e3f4a5b6)); }
    return { p: p, d: d };
  }
  function refundHTML(p) {
    var r = p.refund, out = '';
    if (r) {
      out += '<div><span data-field="refund.state">' + PB.badge('refund', r.state) + '</span> <span class="mono muted xs">' + h(r.id) + '</span></div>';
      if (r.state === 'REQUESTED') { out += '<p id="refund-requested-text" class="success-text small" style="margin-top:var(--s-1)"><strong>Refund requested</strong>. An admin will approve or reject it.</p>'; }
      if (r.state === 'REJECTED' || r.state === 'FAILED') {
        out += '<p class="small" style="margin-top:var(--s-1)" data-field="refund.reason_code">Reason code: ' + (r.reason_code ? '<strong class="mono">' + h(r.reason_code) + '</strong> (' + h(PB.REASONS[r.reason_code]) + ')' : '<span class="muted">none recorded</span>') + '</p>';
      }
      return out;
    }
    if (p.state !== 'COMPLETED') { return '<span class="muted">Not available. Only COMPLETED payments can be refunded.</span>'; }
    return '<button type="button" class="btn secondary" id="req-refund" ' + (pending ? 'disabled aria-busy="true"' : '') + ' aria-label="Request refund for ' + p.id + '" data-api="POST /refunds">' + (pending ? '<span class="spinner" aria-hidden="true"></span>Requesting…' : 'Request refund') + '</button> ' + PB.api('POST /refunds {payment_id}') +
      '<div id="refund-err" role="alert" style="margin-top:var(--s-2)">' + (errMsg ? '<div class="banner error"><span class="msg">' + h(errMsg) + '</span></div>' : '') + '</div>';
  }
  var cur;
  function render(root, ctx) {
    if (ctx.state === 'loading') { root.innerHTML = '<div class="page-head"><div><h1>Payment</h1></div></div>' + PB.detailSkeleton(); return; }
    if (ctx.state === 'error') { root.innerHTML = '<div class="page-head"><div><h1>Payment</h1></div></div>' + PB.notFound('pay_unknown00000'); return; }
    cur = base(); pending = false; errMsg = '';
    draw(root);
  }
  function draw(root) {
    var p = cur.p;
    root.innerHTML = '<div class="page-head"><div><h1>Payment <span class="mono" style="font-size:var(--fs-xl)">' + h(p.id) + '</span></h1><p><a href="E3-S2.html" data-route="/payments">Back to payments</a></p></div><span class="route">/payments/' + p.id + '</span></div>' +
      PB.detailHTML(p, cur.d, { refundSlot: refundHTML(p) });
    var b = PB.$('req-refund'); if (b) { b.addEventListener('click', request); }
  }
  function request() {
    pending = true; errMsg = ''; draw(PB.$('main')); PB.$('req-refund').focus();
    PB.after(900, function () {
      pending = false;
      if (outcome === '201') {
        cur.p.refund = { id: 'rfd_' + PB.uuid().replace(/-/g, '').slice(0, 12), state: 'REQUESTED', reason_code: null };
        cur.d.events.push({ id: 'evt_refund01', type: 'REFUND_REQUESTED', payload: { refund_id: cur.p.refund.id }, at: new Date().toISOString().replace(/\.\d+Z$/, 'Z') });
        draw(PB.$('main')); PB.announce('Refund requested'); PB.$('refund-requested-text').setAttribute('tabindex', '-1'); PB.$('refund-requested-text').focus();
      } else {
        errMsg = outcome === '409' ? 'A refund was already requested for this payment' : outcome === '422' ? 'Only completed payments can be refunded' : 'Something went wrong. Please try again.';
        draw(PB.$('main')); var b = PB.$('req-refund'); if (b) { b.focus(); }
      }
    });
  }
  PB.init({
    id: 'E5-S3', title: 'Customer refund request', route: '/payments/:id', roles: ['customer'], defaultRole: 'customer', nav: 'E3-S2.html', states: ['happy', 'loading', 'error'], render: render,
    onInit: function () {
      PB.addDev('<label>Payment scenario <select id="dev-scen" aria-label="Payment scenario">' + Object.keys(SC).map(function (k) { return '<option value="' + k + '">' + SC[k] + '</option>'; }).join('') + '</select></label>' +
        '<label>Server outcome <select id="dev-out" aria-label="Server outcome"><option value="201">201 Created</option><option value="409">409 REFUND_ALREADY_EXISTS</option><option value="422">422 PAYMENT_NOT_REFUNDABLE</option><option value="500">500 INTERNAL_ERROR</option></select></label>');
      PB.$('dev-scen').addEventListener('change', function (e) { scen = e.target.value; PB.render(); });
      PB.$('dev-out').addEventListener('change', function (e) { outcome = e.target.value; });
    }
  });
})();

</script>
</body>
</html>
